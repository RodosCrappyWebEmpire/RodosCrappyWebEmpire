      <header style="text-align:center;margin-bottom:48px;">
        <h1 style="color:#33FF33;font-family:monospace;letter-spacing:2px;font-size:24px;">RODO'S CRAPPY WEB EMPIRE</h1>
        <p style="color:#77BB77;margin-top:8px;font-family:monospace;letter-spacing:2px;font-size:13px;">RCWE :: side projects lab</p>
        <p style="color:#CCFFCC;margin-top:24px;line-height:1.7;font-size:18px;">Una colección de aplicaciones web hechas con más entusiasmo que presupuesto.</p>
        <p style="color:#77BB77;margin-top:8px;font-style:italic;">A collection of web apps made with more enthusiasm than budget.</p>
      </header>

      <hr style="border:none;border-top:1px solid #1A3A1A;margin:32px 0;" />

      <section>
        <h2 style="color:#33FF33;font-family:monospace;letter-spacing:2px;">Sobre / About</h2>
        <p style="color:#CCFFCC;line-height:1.8;margin-top:16px;">
          RCWE es el lado experimental del portfolio de <a href="https://ragustingarcia.com/" style="color:#33FF33;">Rodolfo Agustín García</a>. Aquí viven proyectos lúdicos y experimentos. El foco actual son herramientas para el ecosistema de campañas D&amp;D <strong>LODTE — La Orden del Tabernero Errante</strong> (<a href="https://www.lodte.com.ar/" style="color:#33FF33;">lodte.com.ar</a>).
        </p>
        <p style="color:#77BB77;line-height:1.8;margin-top:16px;font-style:italic;">
          RCWE is the experimental side of Rodolfo Agustín García's portfolio. Side projects and experiments live here. Current focus: tooling for the LODTE D&amp;D campaign ecosystem.
        </p>
      </section>

      <hr style="border:none;border-top:1px solid #1A3A1A;margin:32px 0;" />

      <section>
        <h2 style="color:#33FF33;font-family:monospace;letter-spacing:2px;">Proyectos / Projects</h2>

        <article style="margin-top:20px;padding-bottom:16px;border-bottom:1px solid #1A3A1A;">
          <h3 style="color:#CCFFCC;margin-bottom:6px;">El Códice del Tabernero</h3>
          <p style="color:#77BB77;line-height:1.7;">Herramienta de cifrado polialfabético para campañas de D&amp;D. Permite a dungeon masters crear mensajes codificados para sus jugadores. <em>Polyalphabetic cipher tool for D&amp;D campaigns. Dungeon masters create encoded messages for their players to decipher in-game.</em></p>
          <p><a href="https://elcodicedeltabernero.netlify.app/" style="color:#33FF33;">elcodicedeltabernero.netlify.app →</a></p>
        </article>

        <article style="margin-top:20px;padding-bottom:16px;border-bottom:1px solid #1A3A1A;">
          <h3 style="color:#CCFFCC;margin-bottom:6px;">Los Dados del Tabernero</h3>
          <p style="color:#77BB77;line-height:1.7;">Lanzador de dados para D&amp;D 5e. Soporta notación estándar (1d20, 4d6kh3, etc.) con historial de tiradas. <em>D&amp;D 5e dice roller. Supports standard dice notation with rolling history.</em></p>
          <p><a href="https://losdadosdeltabernero.netlify.app/" style="color:#33FF33;">losdadosdeltabernero.netlify.app →</a></p>
        </article>

        <article style="margin-top:20px;">
          <h3 style="color:#CCFFCC;margin-bottom:6px;">Sala de Mapas</h3>
          <p style="color:#77BB77;line-height:1.7;">Visor de mapas compartidos en tiempo real para sesiones de D&amp;D. Múltiples jugadores conectados ven el mismo mapa actualizado en vivo por el dungeon master. Stack: Flask + SocketIO + MongoDB. <em>Real-time shared map viewer for D&amp;D sessions. Stack: Flask + SocketIO + MongoDB.</em></p>
          <p><a href="https://lodte-sala-de-mapas.onrender.com/" style="color:#33FF33;">lodte-sala-de-mapas.onrender.com →</a></p>
        </article>
      </section>
